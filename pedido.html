<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">

<body>

<header class="topo">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="index.html">E-Burguers</a>

            <div id="menu">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Início</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="sobre.html">Sobre</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="pedido.html">Pedido</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
</header>

<main class="principal">

<section class="container secao">

<h2>Fazer Pedido</h2>

<form>

<div class="row">

    <div class="col-md-6">

        <h3>Produtos</h3>

        <label>Hambúrguer (R$38):</label>
        <input type="number" id="hamburguer" value="0" min="0">

        <label>Batata (R$10):</label>
        <input type="number" id="batata" value="0" min="0">

        <label>Refrigerante (R$6):</label>
        <input type="number" id="refrigerante" value="0" min="0">

        <h3>Entrega</h3>

        <label>Retirar</label>
        <input type="radio" name="entrega">

        <label>Entrega</label>
        <input type="radio" name="entrega">

        <h3>Forma de pagamento</h3>

        <select>
            <option>Dinheiro</option>
            <option>Cartão</option>
            <option>Pix</option>
        </select>

        <h3>Extras</h3>

        <input type="checkbox"> Ketchup<br>
        <input type="checkbox"> Maionese<br>

    </div>

    
    <div class="col-md-6">

        <h3>Contato</h3>

        <label>Nome:</label>
        <input type="text" id="nome" placeholder="Digite o seu nome">

        <label>Email:</label>
        <input type="email" id="email" placeholder="Digite o seu email">

        <label>Telefone:</label>
        <input type="tel" id="telefone" placeholder="Digite o seu telefone">

        <label>Observações:</label>
        <textarea id="observacoes" placeholder="Alguma observação sobre o pedido?"></textarea>

    </div>

</div>

<br>

<button type="button" onclick="calcular()">Calcular</button>
<button type="button" onclick="contato()">Entrar em Contato</button>

</form>

<h3 id="resultado"></h3>

</section>

</main>

<footer class="rodape">

        <a href="https://www.unip.br" target="_blank" class="link-UNIP">

    </p>
</footer>

</body>
</html>
