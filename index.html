<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Burguers</title>
    <link rel="icon" type="image/x-icon" href="img/icon.png">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS externo -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<!-- HEADER -->
<header>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="index.html">E-Burguers</a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="menu">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Início</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="sobre.html">Sobre</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="pedido.html">Pedido</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
</header>

<!-- MAIN -->
<main>

    <!-- CAROUSEL -->
    <section class="container mt-4">
        <div id="carouselExample" class="carousel slide" data-bs-ride="carousel" data-bs-interval="3000">

            <div class="carousel-inner">
                <div class="carousel-item active">
                    <img src="img/carousel1.jpg" class="d-block w-100" alt="Lanche 1">
                </div>

                <div class="carousel-item">
                    <img src="img/carousel2.jpg" class="d-block w-100" alt="Lanche 2">
                </div>

                <div class="carousel-item">
                    <img src="img/carousel3.jpg" class="d-block w-100" alt="Lanche 3">
                </div>
            </div>

            <button class="carousel-control-prev" type="button" data-bs-target="#carouselExample" data-bs-slide="prev">
                <span class="carousel-control-prev-icon"></span>
            </button>

            <button class="carousel-control-next" type="button" data-bs-target="#carouselExample" data-bs-slide="next">
                <span class="carousel-control-next-icon"></span>
            </button>

        </div>
    </section>

    <!-- CARDS -->
    <section class="container mt-4">
        <h2>Nossos Produtos</h2>

        <div class="row">

            <div class="col-md-4">
                <div class="card">
                    <img src="img/hamburguer.jpg" class="card-img-top" alt="Hamburguer">
                    <div class="card-body">
                        <h5 class="Hamburguer.jpg">Hambúrguer</h5>
                        <p>R$ 38,00</p>
                    </div>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card">
                    <img src="img/batata.jpg" class="card-img-top" alt="Batata">
                    <div class="card-body">
                        <h5 class="card-title">Batata</h5>
                        <p>R$ 10,00</p>
                    </div>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card">
                    <img src="img/refrigerante.jpg" class="card-img-top" alt="Refrigerante">
                    <div class="card-body">
                        <h5 class="card-title">Refrigerante</h5>
                        <p>R$ 6,00</p>
                    </div>
                </div>
            </div>

        </div>
    </section>

</main>

<!-- FOOTER -->
<footer class="bg-dark text-white text-center mt-4">
    <p><a href="https://www.unip.br" target="_blank" class="link-UNIP">© 2026 - Site Desenvolvido por alunos da UNIP</a></p>
</footer>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
